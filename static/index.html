<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nyaya Saathi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&family=Noto+Sans+Kannada:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#16202B;--bg:#F5F6F8;--pri:#1D4E89;--pri-d:#163B69;--line:#D9DEE5;--amber:#8A5300;--amber-bg:#FFF4D6;--red:#B3261E}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 Mukta,"Noto Sans Kannada",system-ui,sans-serif}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;background:var(--pri-d);color:#fff}
.brand{font-weight:800;font-size:1.3rem}
.top select{width:auto;min-height:44px;padding:6px 10px;font-size:1rem}
main{max-width:720px;margin:0 auto;padding:16px}
.tag{margin:4px 0 16px;color:#4A5766}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
h2{margin:0 0 6px;font-size:1.35rem;line-height:1.3}
label{display:block;margin:14px 0 4px;font-weight:600}
.muted{color:#4A5766;font-size:.92rem;margin:0}
input,select{font:inherit;width:100%;min-height:52px;padding:10px 12px;border:2px solid #9AA6B4;border-radius:12px;background:#fff;color:var(--ink)}
.btn{font:inherit;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 18px;border-radius:12px;border:2px solid var(--pri);background:#fff;color:var(--pri);cursor:pointer;text-decoration:none}
.btn.primary{background:var(--pri);color:#fff}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.big{width:100%;min-height:60px;font-size:1.1rem}
.btn:disabled{opacity:.55;cursor:wait}
:focus-visible{outline:4px solid #E8A200;outline-offset:2px}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.th{position:relative;width:110px;height:140px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#EEF1F5}
.th img{width:100%;height:100%;object-fit:cover}
.pdf{display:grid;place-items:center;height:100%;text-align:center;font-weight:800;padding:6px}
.pdf small{font-weight:400;word-break:break-all}
.x{position:absolute;top:4px;right:4px;width:36px;height:36px;border-radius:50%;border:0;background:#16202Bcc;color:#fff;font-size:1.3rem;cursor:pointer}
.err{color:var(--red);font-weight:600;margin:12px 0 0}
.load{display:flex;gap:12px;align-items:center;margin-top:14px}
.spin{width:28px;height:28px;border:4px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:s 1s linear infinite;flex:none}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.help{margin-top:14px}
.helpbox{margin-top:10px;padding:14px;border-radius:12px;background:#FDECEA;border:1px solid #F3B8B3}
.urgent{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:14px;background:var(--red);color:#fff;margin-bottom:14px}
.urgent .btn{background:#fff;color:var(--red);border-color:#fff}
.ans:focus{outline:none}
.sec{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:0 0 12px}
.sec h3{margin:0 0 4px;font-size:1.08rem;color:var(--pri)}
.sec.dl{border-left:8px solid #E8A200;background:var(--amber-bg)}
.sec.dl h3{color:var(--amber)}
.sec p,.sec ul{margin:4px 0}.sec ul{padding-left:22px}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.bar .btn{flex:1 1 130px}
.bub{max-width:92%;padding:10px 14px;border-radius:14px;margin:10px 0}
.bub.me{margin-left:auto;background:var(--pri);color:#fff}
.bub.bot{background:#fff;border:1px solid var(--line)}
.bub .sec{border:0;padding:0;margin:0;background:none}
.row{display:flex;gap:10px}.row input{flex:1}
.foot{margin:18px 0 8px;font-size:.9rem;color:#4A5766}
@media print{.top,#up,.noprint{display:none!important}body{background:#fff}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">⚖ <span data-i="title"></span></div>
  <select id="lang" aria-label="Language">
    <option value="en">English</option><option value="hi">हिंदी</option><option value="kn">ಕನ್ನಡ</option>
  </select>
</header>
<main>
  <p class="tag" data-i="tag"></p>

  <section id="consent" class="card">
    <p id="consentText"></p>
    <button class="btn primary big" id="agree" data-i="agree"></button>
  </section>

  <div id="app" hidden>
    <section id="up" class="card">
      <h2 data-i="upload"></h2>
      <p class="muted" data-i="hint"></p>
      <input id="files" type="file" accept="image/*,.pdf" multiple hidden>
      <div style="margin-top:12px"><button class="btn primary big" id="pick" type="button" data-i="pick"></button></div>
      <div id="thumbs" class="thumbs"></div>
      <label for="rd" data-i="received"></label>
      <input id="rd" type="date">
      <p class="muted" data-i="receivedHint"></p>
      <label for="dist" data-i="district"></label>
      <select id="dist"><option value="" data-i="none"></option></select>
      <p id="err" class="err" role="alert" hidden></p>
      <div style="margin-top:16px"><button class="btn primary big" id="go" data-i="go"></button></div>
      <div id="load" class="load" hidden aria-live="polite"><div class="spin"></div><div><b id="lstep"></b><p class="muted" data-i="wait"></p></div></div>
      <button class="btn big help" id="helpBtn" type="button" data-i="help" aria-expanded="false"></button>
      <div id="helpBox" class="helpbox" hidden><p id="helpText"></p><a class="btn danger" href="tel:15100" data-i="call"></a></div>
    </section>

    <section id="out" hidden>
      <div id="urg" class="urgent" role="alert" hidden><b data-i="urgent"></b><a class="btn" href="tel:15100" data-i="call"></a></div>
      <article id="ans" tabindex="-1"></article>
      <section id="briefBox" class="sec noprint" hidden>
        <h3 data-i="briefTitle"></h3>
        <p id="briefStatus" data-i="briefStatus" class="muted"></p>
        <button class="btn" id="downloadBrief" data-i="downloadBrief" type="button"></button>
        <button class="btn" id="saveToWorkspace" data-i="saveToWorkspace" type="button"></button>
      </section>
      <div class="bar noprint">
        <button class="btn" id="lis" data-i="listen"></button>
        <button class="btn" id="prt" data-i="print"></button>
        <button class="btn" id="up1" data-i="up"></button>
        <button class="btn" id="dn1" data-i="down"></button>
      </div>
      <p id="fb" class="muted" hidden data-i="thanks"></p>
      <div id="chat" aria-live="polite"></div>
      <div class="noprint">
        <label for="q" data-i="follow"></label>
        <div class="row"><input id="q"><button class="btn primary" id="qs" data-i="ask"></button></div>
      </div>
      <p class="foot" data-i="footer"></p>
      <button class="btn big noprint" id="again" data-i="again"></button>
    </section>
  </div>
</main>

<script src="/static/index.js" defer></script>
</body>
</html>
