# Deadline rules for Indian legal notices.
# One entry per document type. A law student / lawyer must verify every entry (verified: false until then).
# Dates and periods written in the notice itself are read from the notice (see deadlines.py) and take priority.
# A rule marked `fallback: true` is used only when the notice states no period of its own.

cheque_bounce_138:
  description: "Section 138 NI Act: Pay the amount within 15 days of receipt of notice to avoid prosecution."
  relative_deadlines:
    - label: "pay within 15 days"
      days: 15
      from: "receipt"
  notes: "Section 138(c) commonly gives a 15-day window to make payment from receipt of the notice. Verify exact provision and local practice."
  source: "Negotiable Instruments Act (provisional)"
  verified: false

court_summons:
  description: "Court summons: appear on the hearing date; file written statement within statutory period for civil suits."
  relative_deadlines:
    - label: "file written statement"
      days: 30
      from: "receipt"
  notes: "The hearing date is an explicit date in the summons, so it is read from the document. CPC Order VIII Rule 1 gives 30 days from service of summons for the written statement (the court may extend; verify local rules)."
  source: "Code of Civil Procedure (CPC) — Order VIII, Rule 1 (provisional)"
  verified: false

eviction_or_rent:
  description: "Eviction or rent recovery notices: follow the period stated in the notice; for monthly tenancies Section 106 TPA / local Rent Control rules may give 15 days."
  relative_deadlines:
    - label: "monthly tenancy fallback: 15 days"
      days: 15
      from: "receipt"
      fallback: true   # only used when the notice states no period of its own
  notes: "Use the period stated in the notice when present. Section 106 (TPA) or local Rent Control rules may provide 15-day periods for monthly tenancies — verify."
  source: "Transfer of Property Act / Rent Practice (provisional)"
  verified: false

labour_or_wage:
  description: "Labour/wage recovery: follow statutory or scheme deadlines; where not stated, use notice timelines."
  relative_deadlines: []
  notes: "Labour laws and municipal schemes vary; follow deadlines in the notice or scheme."
  source: "Labour laws / local authorities (provisional)"
  verified: false

scheme_rejection:
  description: "Rejection of scheme/subsidy: follow appeal timelines stated in the notice."
  relative_deadlines: []
  notes: "Appeal or review periods are usually specified in the scheme notice — use those."
  source: "Scheme rules (provisional)"
  verified: false

family_or_maintenance:
  description: "Family or maintenance matters: follow dates stated in the notice or court order."
  relative_deadlines: []
  notes: "Domestic violence or maintenance orders have specific procedures; use dates in the document."
  source: "Family law / Protection of Women (provisional)"
  verified: false

other:
  description: "Other document types: default to using explicit dates in the notice."
  relative_deadlines: []
  notes: "If no relative rule applies, rely solely on dates stated in the document."
  source: "General guidance"
  verified: false
